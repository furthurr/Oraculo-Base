[project]
name = "oraculo"
version = "0.1.0"
description = "Bot de Telegram que conversa con proveedores de IA configurables"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21,<23",
    "httpx>=0.27",
    "PyYAML>=6,<7",
    "pypdf>=4",
    "faster-whisper>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
